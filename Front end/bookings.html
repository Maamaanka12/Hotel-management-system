<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HMS — Bookings</title>

  <!-- Apply saved theme before first paint -->
  <script>
    if (localStorage.getItem('hms_theme') === 'light') {
      document.documentElement.classList.add('light');
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />

  <script src="tailwind-config.js"></script>

  <link rel="stylesheet" href="theme.css" />
  <style>
    .input-field:focus { outline: none; border-color: #B8962E; box-shadow: 0 0 0 3px rgba(184,150,46,0.15); }
    .table-row-hover:hover { background: var(--row-hover); }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }
  </style>
</head>

<body class="flex h-screen overflow-hidden">

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <aside id="sidebar"
    class="fixed lg:static inset-y-0 left-0 z-30 w-64 flex flex-col flex-shrink-0 overflow-y-auto transform -translate-x-full lg:translate-x-0 transition-transform duration-300"
    style="background: var(--bg-sidebar); border-right: 1px solid var(--border-subtle);">

  </aside>

  <main class="flex-1 flex flex-col overflow-hidden">

    <header class="flex items-center justify-between px-6 py-4 flex-shrink-0" style="background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle);"></header>

    <div class="flex-1 overflow-y-auto px-6 py-6">

      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div>
          <h3 class="font-display text-white text-2xl font-bold">Booking Management</h3>
          <p class="text-slate-500 text-sm mt-1"><span id="bookingCountDisplay">0</span> total bookings</p>
        </div>
        <!-- Status filter tabs -->
        <div class="flex items-center gap-1 p-1 rounded-lg" style="background: var(--bg-card);">
          <button onclick="setStatusFilter('All')"      id="filterAll"        class="filter-btn active-filter px-3 py-1.5 rounded-md text-xs font-medium transition-all">All</button>
          <button onclick="setStatusFilter('Active')"   id="filterActive"     class="filter-btn px-3 py-1.5 rounded-md text-xs font-medium transition-all text-slate-400 hover:text-white">Active</button>
          <button onclick="setStatusFilter('Checked Out')" id="filterCheckedOut" class="filter-btn px-3 py-1.5 rounded-md text-xs font-medium transition-all text-slate-400 hover:text-white">Checked Out</button>
          <button onclick="setStatusFilter('Cancelled')" id="filterCancelled" class="filter-btn px-3 py-1.5 rounded-md text-xs font-medium transition-all text-slate-400 hover:text-white">Cancelled</button>
        </div>
      </div>

      <!-- Bookings Table -->
      <div class="rounded-xl overflow-hidden" style="background: var(--bg-card); border: 1px solid var(--border-subtle);">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr style="border-bottom: 1px solid var(--border-subtle);">
                <th class="text-left text-slate-500 text-xs font-semibold uppercase tracking-wider px-5 py-3">Customer</th>
                <th class="text-left text-slate-500 text-xs font-semibold uppercase tracking-wider px-5 py-3">Room</th>
                <th class="text-left text-slate-500 text-xs font-semibold uppercase tracking-wider px-5 py-3 hidden sm:table-cell">Check-In</th>
                <th class="text-left text-slate-500 text-xs font-semibold uppercase tracking-wider px-5 py-3 hidden md:table-cell">Check-Out</th>
                <th class="text-left text-slate-500 text-xs font-semibold uppercase tracking-wider px-5 py-3 hidden lg:table-cell">Nights</th>
                <th class="text-left text-slate-500 text-xs font-semibold uppercase tracking-wider px-5 py-3">Status</th>
                <th class="text-right text-slate-500 text-xs font-semibold uppercase tracking-wider px-5 py-3">Actions</th>
              </tr>
            </thead>
            <tbody id="bookingsTableBody"></tbody>
          </table>
        </div>
        <div id="bookingsEmptyState" class="hidden text-center py-16">
          <svg class="w-12 h-12 text-slate-700 mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <p class="text-slate-400 text-sm font-medium">No bookings found</p>
          <p class="text-slate-600 text-xs mt-1">Create a new booking using the button above.</p>
        </div>
      </div>

    </div>
  </main>

  <!-- ADD / EDIT BOOKING MODAL -->
  <div class="modal-backdrop" id="bookingModal" onclick="handleModalBackdropClick(event)">
    <div class="modal-box w-full max-w-lg rounded-xl shadow-2xl" style="background: var(--bg-card); border: 1px solid var(--border-strong);">

      <div class="flex items-center justify-between px-6 py-5 border-b" style="border-color: var(--border-subtle);">
        <h3 id="modalTitle" class="text-white font-semibold text-base">New Booking</h3>
        <button onclick="closeModal()" class="text-slate-500 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="px-6 py-5 space-y-4">
        <div id="modalAlert" class="hidden px-4 py-3 rounded-lg text-sm font-medium"></div>

        <!-- Customer selector -->
        <div>
          <label class="block text-slate-300 text-xs font-semibold uppercase tracking-widest mb-2">Customer <span class="text-red-400">*</span></label>
          <select id="inputBookingCustomer"
            class="input-field w-full px-4 py-2.5 rounded-lg text-white text-sm border border-white/10 transition-all appearance-none"
            style="background: var(--bg-input);">
            <option value="">Select a customer...</option>
          </select>
        </div>

        <!-- Room selector -->
        <div>
          <label class="block text-slate-300 text-xs font-semibold uppercase tracking-widest mb-2">Room <span class="text-red-400">*</span></label>
          <select id="inputBookingRoom"
            class="input-field w-full px-4 py-2.5 rounded-lg text-white text-sm border border-white/10 transition-all appearance-none"
            style="background: var(--bg-input);">
            <option value="">Select a room...</option>
          </select>
        </div>

        <!-- Dates row -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-slate-300 text-xs font-semibold uppercase tracking-widest mb-2">Check-In <span class="text-red-400">*</span></label>
            <input type="date" id="inputCheckIn"
              class="input-field w-full px-4 py-2.5 rounded-lg text-white text-sm border border-white/10 transition-all"
              style="background: var(--bg-input); color-scheme: var(--scheme);" />
          </div>
          <div>
            <label class="block text-slate-300 text-xs font-semibold uppercase tracking-widest mb-2">Check-Out <span class="text-red-400">*</span></label>
            <input type="date" id="inputCheckOut"
              class="input-field w-full px-4 py-2.5 rounded-lg text-white text-sm border border-white/10 transition-all"
              style="background: var(--bg-input); color-scheme: var(--scheme);" />
          </div>
        </div>

        <!-- Duration preview -->
        <div id="durationPreview" class="hidden px-4 py-2.5 rounded-lg text-sm" style="background: rgba(184,150,46,0.08); border: 1px solid rgba(184,150,46,0.2);">
          <span class="text-gold font-medium" id="durationText">—</span>
        </div>

        <!-- Status -->
        <div>
          <label class="block text-slate-300 text-xs font-semibold uppercase tracking-widest mb-2">Status <span class="text-red-400">*</span></label>
          <select id="inputBookingStatus"
            class="input-field w-full px-4 py-2.5 rounded-lg text-white text-sm border border-white/10 transition-all appearance-none"
            style="background: var(--bg-input);">
            <option value="Pending">Pending</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Checked-In">Checked-In</option>
            <option value="Checked-Out">Checked-Out</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>

      </div>

      <div class="flex items-center justify-end gap-3 px-6 py-4 border-t" style="border-color: var(--border-subtle);">
        <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-white/5 transition-all">Cancel</button>
        <button id="modalSaveButton" onclick="handleSaveBooking()"
          class="px-5 py-2 rounded-lg text-sm font-semibold text-white transition-all hover:opacity-90 active:scale-[0.98]"
          style="background: linear-gradient(135deg, #B8962E, #D4AF54);">
          Save Booking
        </button>
      </div>

    </div>
  </div>

  <!-- DELETE CONFIRMATION MODAL -->
  <div class="modal-backdrop" id="deleteModal" onclick="handleDeleteBackdropClick(event)">
    <div class="modal-box w-full max-w-sm rounded-xl shadow-2xl" style="background: var(--bg-card); border: 1px solid var(--border-strong);">
      <div class="px-6 py-6 text-center">
        <div class="w-12 h-12 rounded-full bg-red-900/30 flex items-center justify-center mx-auto mb-4">
          <svg class="w-6 h-6 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </div>
        <h3 class="text-white font-semibold text-base mb-2">Delete Booking</h3>
        <p class="text-slate-400 text-sm">Are you sure you want to delete this booking? The room status will be reset to <span class="text-white font-medium">Available</span>.</p>
      </div>
      <div class="flex gap-3 px-6 pb-6">
        <button onclick="closeDeleteModal()" class="flex-1 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-white/5 transition-all border border-white/10">Cancel</button>
        <button onclick="confirmDeleteBooking()" class="flex-1 px-4 py-2.5 rounded-lg text-sm font-semibold text-white bg-red-600 hover:bg-red-500 transition-all">Delete</button>
      </div>
    </div>
  </div>

  <style>
    .active-filter { background: rgba(184,150,46,0.15); color: #D4AF54; }
  </style>


  <script src="api/api.js"></script>
  <script src="common.js"></script>
  <script src="components.js"></script>
  <script src="bookings.js"></script>

</body>
</html>
