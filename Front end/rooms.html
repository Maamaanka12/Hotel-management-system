<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HMS — Rooms</title>

  <!-- Apply saved theme before first paint -->
  <script>
    if (localStorage.getItem('hms_theme') === 'light') {
      document.documentElement.classList.add('light');
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold:    { DEFAULT: "#B8962E", light: "#D4AF54", dark: "#8A6E1A" },
            surface: { DEFAULT: "#12172B", card: "#1A2040", sidebar: "#0E1322", input: "#0C0F1A" },
          },
          fontFamily: {
            display: ["Playfair Display", "serif"],
            body:    ["Inter", "sans-serif"],
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="theme.css" />
  <style>
    .input-field:focus { outline: none; border-color: #B8962E; box-shadow: 0 0 0 3px rgba(184,150,46,0.15); }
    .table-row-hover:hover { background: var(--row-hover); }
  </style>
</head>

<body class="flex h-screen overflow-hidden">

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <aside
    id="sidebar"
    class="fixed lg:static inset-y-0 left-0 z-30 w-64 flex flex-col flex-shrink-0 overflow-y-auto transform -translate-x-full lg:translate-x-0 transition-transform duration-300"
    style="background: var(--bg-sidebar); border-right: 1px solid var(--border-subtle);"
  ></aside>

  <main class="flex-1 flex flex-col overflow-hidden">

    <!-- Top Bar -->
    <header class="flex items-center justify-between px-6 py-4 flex-shrink-0" style="background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle);"></header>

    <!-- Page Body -->
    <div class="flex-1 overflow-y-auto px-6 py-6">

      <!-- Page Title + Search -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div>
          <h3 class="font-display text-white text-2xl font-bold">Room Management</h3>
          <p class="text-slate-500 text-sm mt-1">
            <span id="roomCountDisplay">0</span> rooms registered
          </p>
        </div>
        <!-- Search Input -->
        <div class="relative">
          <svg class="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
          <input
            type="text"
            id="roomSearchInput"
            placeholder="Search by room number or type..."
            oninput="handleSearch()"
            class="input-field pl-9 pr-4 py-2.5 rounded-lg text-white placeholder-slate-500 text-sm border border-white/10 w-full sm:w-64 transition-all"
            style="background: var(--bg-card);"
          />
        </div>
      </div>

      <!-- Rooms Table -->
      <div class="rounded-xl overflow-hidden" style="background: var(--bg-card); border: 1px solid var(--border-subtle);">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr style="border-bottom: 1px solid var(--border-subtle);">
                <th class="text-left text-slate-500 text-xs font-semibold uppercase tracking-wider px-5 py-3">Room No.</th>
                <th class="text-left text-slate-500 text-xs font-semibold uppercase tracking-wider px-5 py-3">Type</th>
                <th class="text-left text-slate-500 text-xs font-semibold uppercase tracking-wider px-5 py-3 hidden sm:table-cell">Price / Night</th>
                <th class="text-left text-slate-500 text-xs font-semibold uppercase tracking-wider px-5 py-3">Status</th>
                <th class="text-right text-slate-500 text-xs font-semibold uppercase tracking-wider px-5 py-3">Actions</th>
              </tr>
            </thead>
            <tbody id="roomsTableBody">
              <!-- Populated by rooms.js -->
            </tbody>
          </table>
        </div>

        <!-- Empty State -->
        <div id="roomsEmptyState" class="hidden text-center py-16">
          <svg class="w-12 h-12 text-slate-700 mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
          <p class="text-slate-400 text-sm font-medium">No rooms found</p>
          <p class="text-slate-600 text-xs mt-1">Add your first room using the button above.</p>
        </div>
      </div>

    </div>
  </main>

  <!-- ================================================================ -->
  <!-- ADD / EDIT ROOM MODAL                                            -->
  <!-- ================================================================ -->
  <div class="modal-backdrop" id="roomModal" onclick="handleModalBackdropClick(event)">
    <div class="modal-box w-full max-w-md rounded-xl shadow-2xl" style="background: var(--bg-card); border: 1px solid var(--border-strong);">

      <!-- Modal Header -->
      <div class="flex items-center justify-between px-6 py-5 border-b" style="border-color: var(--border-subtle);">
        <h3 id="modalTitle" class="text-white font-semibold text-base">Add Room</h3>
        <button onclick="closeModal()" class="text-slate-500 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="px-6 py-5 space-y-4">

        <!-- Alert inside modal -->
        <div id="modalAlert" class="hidden px-4 py-3 rounded-lg text-sm font-medium"></div>

        <!-- Room Number -->
        <div>
          <label class="block text-slate-300 text-xs font-semibold uppercase tracking-widest mb-2">Room Number <span class="text-red-400">*</span></label>
          <input
            type="text"
            id="inputRoomNumber"
            placeholder="e.g. 101, 202A"
            class="input-field w-full px-4 py-2.5 rounded-lg text-white placeholder-slate-500 text-sm border border-white/10 transition-all"
            style="background: var(--bg-input);"
          />
        </div>

        <!-- Room Type -->
        <div>
          <label class="block text-slate-300 text-xs font-semibold uppercase tracking-widest mb-2">Room Type <span class="text-red-400">*</span></label>
          <select
            id="inputRoomType"
            class="input-field w-full px-4 py-2.5 rounded-lg text-white text-sm border border-white/10 transition-all appearance-none"
            style="background: var(--bg-input);"
          >
            <option value="" disabled selected>Select a type...</option>
            <option value="Single">Single</option>
            <option value="Double">Double</option>
            <option value="Twin">Twin</option>
            <option value="Suite">Suite</option>
            <option value="Deluxe">Deluxe</option>
            <option value="Penthouse">Penthouse</option>
          </select>
        </div>

        <!-- Price Per Night -->
        <div>
          <label class="block text-slate-300 text-xs font-semibold uppercase tracking-widest mb-2">Price Per Night ($) <span class="text-red-400">*</span></label>
          <input
            type="number"
            id="inputRoomPrice"
            placeholder="e.g. 120"
            min="0"
            step="0.01"
            class="input-field w-full px-4 py-2.5 rounded-lg text-white placeholder-slate-500 text-sm border border-white/10 transition-all"
            style="background: var(--bg-input);"
          />
        </div>

        <!-- Status -->
        <div>
          <label class="block text-slate-300 text-xs font-semibold uppercase tracking-widest mb-2">Status <span class="text-red-400">*</span></label>
          <select
            id="inputRoomStatus"
            class="input-field w-full px-4 py-2.5 rounded-lg text-white text-sm border border-white/10 transition-all appearance-none"
            style="background: var(--bg-input);"
          >
            <option value="Available">Available</option>
            <option value="Booked">Booked</option>
            <option value="Maintenance">Maintenance</option>
          </select>
        </div>

      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-end gap-3 px-6 py-4 border-t" style="border-color: var(--border-subtle);">
        <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-white/5 transition-all">
          Cancel
        </button>
        <button
          id="modalSaveButton"
          onclick="handleSaveRoom()"
          class="px-5 py-2 rounded-lg text-sm font-semibold text-white transition-all hover:opacity-90 active:scale-[0.98]"
          style="background: linear-gradient(135deg, #B8962E, #D4AF54);"
        >
          Save Room
        </button>
      </div>

    </div>
  </div>

  <!-- ================================================================ -->
  <!-- DELETE CONFIRMATION MODAL                                        -->
  <!-- ================================================================ -->
  <div class="modal-backdrop" id="deleteModal" onclick="handleDeleteBackdropClick(event)">
    <div class="modal-box w-full max-w-sm rounded-xl shadow-2xl" style="background: var(--bg-card); border: 1px solid var(--border-strong);">
      <div class="px-6 py-6 text-center">
        <div class="w-12 h-12 rounded-full bg-red-900/30 flex items-center justify-center mx-auto mb-4">
          <svg class="w-6 h-6 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
        </div>
        <h3 class="text-white font-semibold text-base mb-2">Delete Room</h3>
        <p class="text-slate-400 text-sm">Are you sure you want to delete <span id="deleteRoomLabel" class="text-white font-medium"></span>? This action cannot be undone.</p>
      </div>
      <div class="flex gap-3 px-6 pb-6">
        <button onclick="closeDeleteModal()" class="flex-1 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-white/5 transition-all border border-white/10">
          Cancel
        </button>
        <button onclick="confirmDeleteRoom()" class="flex-1 px-4 py-2.5 rounded-lg text-sm font-semibold text-white bg-red-600 hover:bg-red-500 transition-all">
          Delete
        </button>
      </div>
    </div>
  </div>


  <script src="api/api.js"></script>
  <script src="common.js"></script>
  <script src="components.js"></script>
  <script src="rooms.js"></script>

</body>
</html>
